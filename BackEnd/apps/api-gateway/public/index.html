<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend API Server</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        padding: 50px 60px;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 600px;
        width: 90%;
      }

      .status {
        display: inline-block;
        padding: 6px 14px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 20px;
        background: #22c55e;
        color: #0f172a;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 15px;
        font-weight: 600;
      }

      p {
        font-size: 16px;
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .links {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .btn:hover {
        background: #334155;
        transform: translateY(-2px);
      }

      footer {
        margin-top: 30px;
        font-size: 13px;
        color: #64748b;
      }

      @media (max-width: 500px) {
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="status">● Server Online</div>

      <h1>🚀 Backend API Server</h1>

      <p>
        The NestJS backend is running successfully and ready to handle API
        requests.
      </p>

      <footer>© 2026 Backend Service · Built with NestJS</footer>
    </div>
  </body>
</html>
